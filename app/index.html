<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Japan Trip</title>
  <meta name="description" content="Phrasebook, trainer and tools for a trip to Japan. Works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <meta name="format-detection" content="telephone=no">
  <!-- iOS: install via Share → Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Japan Trip">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script>
    // A manually chosen theme is applied before the first frame (no flash). Otherwise follow the system.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.content = t === 'dark' ? '#171613' : '#f5f1e7'; });
      }
      if (localStorage.getItem('jt.lang') === 'zh') { document.documentElement.lang = 'zh-CN'; document.documentElement.dataset.lang = 'zh'; }
    } catch (e) { /* storage unavailable — system theme */ }
  </script>
  <link rel="preload" href="fonts/shippori-mincho-500.kana.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <script>
    // Boot watchdog: if the app has not started (a script failed to load, a stale cache…),
    // replace "Loading…" with an error and a Retry button instead of spinning forever.
    window.__bootFail = function (why) {
      if (document.documentElement.dataset.ready === '1') return;
      var v = document.getElementById('view');
      if (!v || v.querySelector('.card.error')) return;
      v.innerHTML = '<div class="card error" id="boot-error" role="alert"><p><strong>The app did not start.</strong></p>' +
        '<p class="small">' + (why || 'Loading takes too long.') + ' Check the connection and try again.</p>' +
        '<div class="actions"><button class="btn primary" type="button" id="boot-retry">Retry</button></div></div>';
      document.getElementById('boot-retry').onclick = function () { location.reload(); };
    };
    window.__bootTimer = setTimeout(function () { window.__bootFail(); }, 15000);
  </script>
  <script src="vendor/wanakana.min.js" defer></script>
  <script type="module" src="app.js" onerror="window.__bootFail('A part of the app could not be downloaded.')"></script>
</head>
<body>
  <div id="app">
    <main id="view"><p class="loading" role="status">Loading…</p></main>
  </div>
  <noscript><p class="loading">JavaScript is required.</p></noscript>
</body>
</html>
